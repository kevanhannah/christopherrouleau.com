[build]
  base = "sanity"
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Kept in sync with sanity/.node-version, which Netlify reads first.
  NODE_VERSION = "24.19.0"
  NPM_VERSION = "11.17.0"

[[redirects]]
  from = "https://tiny-froyo-134e27.netlify.app/*"
  to = "https://content.christopherrouleau.com/"
  status = 301
  force = true

[[redirects]]
  from = "/*"
  to = "/"
  status = 200